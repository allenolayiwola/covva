openapi: 3.1.0
info:
  title: Covva API
  version: 1.0.0
  summary: REST API for the Covva mobile app and partner (broker/insurer) integrations.
  description: |
    Covva is a **technology platform**. It is not an insurer or broker, does not
    give advice in its own name and never holds premiums. Every response that concerns a
    transaction carries the information needed to show the mandatory disclosure.

    ## Authentication
    * **Customer / partner users** — `Authorization: Bearer <Supabase access token>` (mobile) or the
      Supabase session cookie (web). Requests run as that user, so Postgres Row Level Security applies.
    * **Partner integrations** — `x-api-key: imk_<prefix>_<secret>` (see `/partner/*`). Keys belong to a
      broker or insurer organisation and carry scopes: `requests:read`, `quotes:write`,
      `policies:issue`, `claims:write`, `policies:read`, `claims:read`, `finance:read` (or `*`).
      **Distribution partners** (dealers, banks, landlords, fleets, travel agents…) hold keys with
      `distribution:quote`, `distribution:lead`, `distribution:read` that reach `/distribution/*` only (see docs/EMBEDDING.md).

    ## Envelope
    Every JSON response (except the AI chat stream and redirects) is an `ApiResult`:
    `{ "ok": true, "data": … }` or `{ "ok": false, "error": { "code", "message", "details?" } }`.

    | HTTP | `error.code` | Meaning |
    |---|---|---|
    | 400 | `invalid_input` | Validation failed (`details` lists `{ path, message }`) |
    | 401 | `unauthorised` | Missing/expired token or invalid API key |
    | 403 | `forbidden` | Authenticated but not allowed |
    | 404 | `not_found` | Not found or not visible to you |
    | 409 | `conflict` | Duplicate / already done |
    | 422 | `business_rule` | A product rule blocked it (e.g. quote expired, broker not disclosed). Show `message` to the user. |
    | 429 | `rate_limited` | Slow down; see `Retry-After` |
    | 503 | `unavailable` | Feature switched off or not configured (AI, payments) |
    | 500 | `internal_error` | Unexpected error; quote `x-request-id` to support |

    Every response has an `x-request-id` header (send your own to correlate).

    ## Client identification and platform access (Addendum 4)
    Send `X-Covva-Client: mobile | web | partner-web` on every call (missing = `web`). Customers and
    brokers use the mobile app; **insurer** (and staff) accounts are web-only: a call from `mobile` by an
    account whose only memberships are insurer/staff gets `403 forbidden` with
    `details.reason = "insurer_web_only"` and `details.portalUrl` — show the message and link to the web portal.
    Dual-role users pick a workspace with `POST /me/workspace`; `GET /me` lists `workspaces` with `mobileAllowed`.

    ## Product rules clients must honour
    * Show the broker-of-record disclosure and record it (`POST /requests/{id}/disclosure`) **before** an application.
    * Only `ready_to_accept` quotes can be applied for, and only before `valid_until`.
    * Payment confirmation never activates cover. Show cover as active only when `policy.status = active`.
    * Reporting a claim is not approval. Only the insurer decides claims.
    * When `demoMode` is true, show "Illustrative only · Demo data" near insurer names and prices.
    * AI output is labelled as AI-assisted and is never a suitability or claim decision.
  contact:
    name: Platform engineering
    email: support@covva.com.gh
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: covva.com.gh
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
tags:
  - name: Webhooks
    description: |
      Signed HTTP callbacks to partner endpoints (configured in Team settings → Developer). Every delivery is a
      `POST` with headers `x-covva-event`, `x-covva-delivery`, `x-covva-timestamp` and `x-covva-signature`
      (`HMAC-SHA256(endpoint secret, "{timestamp}.{raw body}")`, hex). Respond 2xx within 10 s; failures retry after
      1 min, 5 min, 30 min, 2 h and 12 h. Payloads carry ids, references, statuses, amounts and dates only — never
      personal data; fetch details through the API. See `docs/WEBHOOKS.md`.
  - name: Me
  - name: Catalogue
  - name: Lookups
  - name: Requests
  - name: Documents
  - name: Applications & payments
  - name: Policies
  - name: Verification
  - name: Claims
  - name: Complaints
  - name: Notifications & devices
  - name: AI
  - name: Family (diaspora)
    description: |
      Sponsors abroad look after family in Ghana: add **beneficiaries**, capture their **consent** by SMS/WhatsApp
      code or signed link (never from the sponsor), link the payer to a policy with a **sponsorship** (optionally a
      **gift** with a message the beneficiary reveals), see the **family dashboard** and report **claims by proxy**
      with the beneficiary's `proxy_claims` consent. Both parties get documents, reminders and claim updates
      (`notifications.recipient_role`).
  - name: Partner API
  - name: Distribution
    description: |
      Embedded distribution (Phase 3). Partners offer Covva quotes at their point of sale — with the embeddable
      widget (`/embed/widget.js`) or these endpoints. Estimates are indicative, sorted by price only (paid
      placements never change the order) and nothing is bound or paid through the partner: the customer continues
      on Covva. Every surface shows "Technology provided by Covva. Insurance provided by licensed insurers and brokers."
      Revenue share is a share of Covva's platform fee, never of the premium.
  - name: Referrals
  - name: Instalments & micro cover
    description: |
      Phase 3. Premiums paid in instalments under the insurer's plan (grace, lapse and reinstatement are the insurer's
      rules) and micro cover by the day, week or month. Every payment is a GHS premium payment to the insurer;
      Covva never holds client funds. Mobile money payments need the payer to approve the prompt on their phone.
  - name: Business accounts
    description: |
      SME & group (Phase 3). A **business account** is an organisation the caller owns or belongs to (roles owner, admin,
      finance, viewer). Owners/admins manage **group schemes** (health, life & funeral, personal accident), their
      **members** (census; CSV bulk upload with row-numbered errors), the **fleet** and **assets**; finance pays
      **consolidated statements**. Quote requests built from a census carry counts only (never member PII) and are always
      handled by a licensed broker. Paying a statement starts **one payment per insurer line** — each settles to that
      insurer; Covva never holds or pools premiums.
  - name: System

  - name: Localisation
    description: UI language (English complete; Twi, Ga and Ewe only as human translators supply them) — catalogue, preferred locale. Send `Accept-Language` or `X-Covva-Locale`.
  - name: Voice notes
    description: Voice recordings with automatic transcripts the user checks and edits before using.
paths:
  /me:
    get:
      tags: [Me]
      summary: Current user — profile, memberships, workspaces, feature flags, consent state
      parameters: [{ $ref: "#/components/parameters/CovvaClient" }]
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: Insurer/staff account calling from the mobile app (`details.reason = insurer_web_only`)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    patch:
      tags: [Me]
      summary: Update own profile
      description: KYC status can't be changed by the client (enforced in the database).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateProfileInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/workspace:
    post:
      tags: [Me]
      summary: Choose the active workspace (dual-role users)
      description: |
        Persists `profiles.active_workspace`. The workspace must be one of the caller's `workspaces` and usable from the
        calling client — an insurer workspace cannot be activated with `X-Covva-Client: mobile`.
      parameters: [{ $ref: "#/components/parameters/CovvaClient" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetActiveWorkspaceInput" } } }
      responses:
        "200":
          description: Stored choice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          activeWorkspace: { $ref: "#/components/schemas/ActiveWorkspace" }
                          workspace: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/consents:
    post:
      tags: [Me]
      summary: Record consent decisions (append-only)
      description: When `version` is omitted the current `terms_version` / `privacy_version` is used.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecordConsentsInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /catalog/categories:
    get:
      tags: [Catalogue]
      summary: Insurance categories with availability and `risk_schema` (form definition)
      security: []
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/Category" } } }
  /catalog/categories/{slug}:
    get:
      tags: [Catalogue]
      summary: One category with approved products from participating insurers
      security: []
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }
  /catalog/insurers:
    get:
      tags: [Catalogue]
      summary: Public directory of active insurers and brokers (for "add a policy bought elsewhere")
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /lookups/vehicle:
    post:
      tags: [Lookups]
      summary: Prefill a motor quote from a Ghana registration number
      description: |
        Normalises the plate (`GR 1234-23`) and looks it up in the cache, then the configured provider
        (DVLA / partner API when `DVLA_API_URL` is set). `found: false` just means "ask the customer" —
        quoting never depends on it. Returns vehicle facts only (make, model, year, body, colour,
        engine, seats, use), never the keeper. Rate-limited (write bucket).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VehicleLookupInput" } } }
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/VehicleLookupResult" } }
        "400": { $ref: "#/components/responses/Error" }
  /needs-assessment:
    get:
      tags: [Catalogue]
      summary: The "help me choose" questions
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Catalogue]
      summary: Run the needs assessment and store the answers
      description: Works signed-in (bearer) or anonymously (pass `anonymousId`). Returns categories to consider — not product advice.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NeedsAssessmentInput" } } }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/NeedsResult" } }

  /requests:
    get:
      tags: [Requests]
      summary: The customer's requests
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Before" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RequestStatus" } }
        - { name: open, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [Requests]
      summary: Create (and by default submit) a request
      description: |
        Validates `risk` against the category's `risk_schema`, routes exactly one broker of record,
        prices estimates from approved rating rules and creates document tasks. `source` is recorded as `mobile`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateRequestInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /requests/{id}:
    get:
      tags: [Requests]
      summary: Request detail — customer-visible timeline, tasks, broker, documents, applications, payments, policies
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }
  /requests/{id}/cancel:
    post:
      tags: [Requests]
      summary: Cancel an open request (customer)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /requests/{id}/quotes:
    get:
      tags: [Requests]
      summary: Quotes, comparison result and disclosure text
      description: |
        `comparison` is the engine output (`insurersCompared`, `productsCompared`, `criteria`, `ranked`, `paidPlacements`,
        `materialExclusions`, `disclaimer`). Show `summary` (e.g. "3 quotes from 3 participating insurers compared"),
        each quote's `statusLabel`, `labels` (explained, never an unexplained "best"), `valid_until` and `comparedAt`.
        Paid placements are listed separately and never ranked.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/QuotesResult" } }
  /requests/{id}/disclosure:
    post:
      tags: [Requests]
      summary: Acknowledge the broker-of-record disclosure (required before applying). Idempotent.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/DisclosureAckInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "201": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /requests/{id}/share:
    post:
      tags: [Requests]
      summary: Save & share the comparison (link, WhatsApp or email)
      description: |
        Creates a share token valid for 14 days. `url` opens a public, read-only comparison
        (`/q/{token}`) that shows quote summaries only — never the customer's name, reference or risk
        details beyond the cover title. `whatsappUrl` is a `https://wa.me/?text=` link with `text`
        prefilled; `channel: email` also emails the summary to `email` (defaults to the account email).
        "Resume later" needs nothing extra: the request itself is saved — `GET /requests`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ShareQuotesInput" } } }
      responses:
        "201":
          description: Share created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/ShareResult" } }
        "404": { $ref: "#/components/responses/Error" }
  /requests/{id}/messages:
    get:
      tags: [Requests]
      summary: Message thread with the broker (oldest first within the page)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Before" }]
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [Requests]
      summary: Send a message on the thread
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PostMessageInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
  /requests/{id}/tasks/{taskId}/complete:
    post:
      tags: [Requests]
      summary: Complete a customer task (document tasks need `documentId`)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/CompleteTaskInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }

  /documents/upload-url:
    post:
      tags: [Documents]
      summary: Get a signed upload URL in the private documents bucket
      description: |
        Path layout `{customerId}/{scope}/{uuid}-{fileName}`. Then `PUT` the file bytes to `signedUrl`
        with the returned headers, then confirm with `POST /documents` (body provided in `confirm.body`).
        Uploading is not the same as notifying the insurer — the broker delivers documents.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UploadUrlInput" } } }
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          bucket: { type: string }
                          path: { type: string }
                          token: { type: string }
                          signedUrl: { type: string, format: uri }
                          method: { type: string, enum: [PUT] }
                          headers: { type: object, additionalProperties: { type: string } }
                          expiresInSeconds: { type: integer }
                          confirm: { type: object }
  /documents:
    post:
      tags: [Documents]
      summary: Confirm an upload and create the document record
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmUploadInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
  /documents/{id}/url:
    get:
      tags: [Documents]
      summary: Signed download URL (valid 5 minutes)
      parameters: [{ $ref: "#/components/parameters/Id" }, { name: download, in: query, schema: { type: string, enum: ["true", "false"] } }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /applications:
    post:
      tags: [Applications & payments]
      summary: Apply for a ready-to-accept quote
      description: Requires the broker disclosure to have been acknowledged and the quote to be `ready_to_accept` and unexpired. Idempotent per quote.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApplyInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /payments:
    post:
      tags: [Applications & payments]
      summary: Start payment for a submitted application
      description: |
        Revalidates the quote at checkout. Premiums settle to the insurer (Paystack subaccount, the insurer's
        Hubtel merchant account, or the insurer's bank account) — never to Covva.
        Open `authorizationUrl` in an in-app browser; for a direct MoMo prompt (`momo` given) `authorizationUrl`
        is null — show `displayText` and poll `GET /payments/{id}`. Pass `callbackUrl` =
        `https://<host>/api/payments/return` from the app to be redirected to `covva://payments/return`.
        **Bank transfer** (`channel: bank_transfer`): `authorizationUrl` is null and `bankTransfer` holds the
        account, amount and the reference to quote; the payment stays `pending` until the credit is confirmed
        (automatically for a dedicated virtual account, otherwise by the insurer/admin reconciliation) — keep
        polling or wait for the `payment.succeeded` notification. `provider` says which rail took the payment
        (`paystack`, `hubtel`, `bank_transfer`, `simulator`).
        In test environments without provider keys a **sandbox simulator** page is returned instead.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InitPaymentRequest" } } }
      responses:
        "201":
          description: Payment started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/InitiatePaymentResult" } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /payments/{id}:
    get:
      tags: [Applications & payments]
      summary: Poll a payment (re-verifies pending Paystack payments)
      description: "`coverActive` is true only when the insurer has issued the policy."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /policies:
    get:
      tags: [Policies]
      summary: Policy wallet
      parameters: [{ name: status, in: query, schema: { $ref: "#/components/schemas/PolicyStatus" } }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /policies/{id}:
    get:
      tags: [Policies]
      summary: Policy detail with cover wording, documents, claims and disclosure
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    patch:
      tags: [Policies]
      summary: Rename a policy (nickname only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [nickname], properties: { nickname: { type: [string, "null"], maxLength: 60 } } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /policies/{id}/documents:
    get:
      tags: [Policies]
      summary: Policy documents with short-lived signed URLs
      description: |
        Every document on the policy with a 15-minute signed download URL. Documents generated by the platform on
        the insurer's behalf (schedule, certificate, motor sticker, premium receipt) are flagged `generated: true`
        and carry their `sha256`; each embeds a QR code that opens `verifyUrl`. `verificationCode` is the
        10-character code behind that QR (null for policies bought elsewhere).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          policyId: { type: string, format: uuid }
                          policyNumber: { type: [string, "null"] }
                          verificationCode: { type: [string, "null"] }
                          stickerNumber: { type: [string, "null"] }
                          verifyUrl: { type: [string, "null"], format: uri }
                          documents:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                kind: { type: string, description: "policy_schedule | certificate | sticker | receipt | policy_wording | endorsement | other" }
                                fileName: { type: string }
                                mimeType: { type: [string, "null"] }
                                sizeBytes: { type: [integer, "null"] }
                                sha256: { type: [string, "null"] }
                                generated: { type: boolean }
                                uploadedByParty: { type: string }
                                createdAt: { type: string, format: date-time }
                                url: { type: [string, "null"], format: uri, description: "Signed URL, valid for expiresInSeconds" }
                                expiresInSeconds: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /policies/external:
    post:
      tags: [Policies]
      summary: Add a policy bought elsewhere (shown as "Added by you")
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddExternalPolicyInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
  /policies/{id}/renewal:
    post:
      tags: [Policies]
      summary: One-tap renewal — refreshed quotes for the same risk (or a switch review for external policies)
      description: |
        Creates a renewal request for the policy's risk with the policy's broker kept as broker of record and
        estimates refreshed from current rates. `renewal` holds `sameInsurer` (the "Renew with <insurer>" offer:
        `oneTap` is true when it is binding — apply and pay in one step), `alternatives` (cheapest first),
        `savings` and `insurersCompared` (show "1 insurer compared" honestly). Existing cover is never
        cancelled. Renewal prices are estimates until the insurer confirms.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/RenewalInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }

  /me/policies/{id}/explain:
    post:
      tags: [AI, Policies]
      summary: Policy explainer — answers grounded in the caller's own schedule and wording, with clause citations
      description: |
        For the signed-in policyholder side only (the customer, the sponsor or the linked beneficiary); brokers, insurers
        and staff get 404. One endpoint, four actions (`action` in the body):
        * `clauses` — the grounding set: `groups[]` of `{ id, heading, group, text }` clauses (schedule fields such as
          `schedule.excess` / `schedule.cover_end`, `cover.*`, `limit.*`, `excess.*`, `exclusion.*`, `benefit.*`,
          `conditions.*`, `claims.*`, `doc.schedule.*`), `versionKey`, `aiAvailable`, `handoff`, `suggestions`, `disclaimer`.
        * `summary` — "Your cover in plain words": `summary.statements[]`, cached per policy and wording version
          (`source: cache | generated | fallback`). Without AI, `fallback` lists the key schedule facts.
        * `ask` — `{ question }` (3–500 chars). Returns `statements[]` of `{ text, citations[] }`; every citation is a
          clause id from the grounding set (checked server-side — unknown ids are dropped and uncited statements removed),
          with `text` (the exact clause) and `quote` (verbatim excerpt or null). `status: not_in_wording` means the wording
          does not answer it: never guess cover; offer the broker. `advisory: true` (should I…, which is better, am I
          covered if…, can I claim for this incident) means only the factual part is given and the broker must advise.
          `mode: clauses_only` (no AI on this environment, or the model failed) returns keyword `matches[]` instead.
          `logId` identifies the Q&A log row for the hand-off.
        * `handoff` — `{ question, clauseIds[], logId? }` posts a customer message to the broker of record on the
          policy's request thread (question, policy reference and the clauses shown) and notifies the broker. 201 with
          `{ sent, requestId, messageId, threadHref, brokerName }`; 422 when there is no broker or thread to post on.
        Always show `disclaimer`: "This explains your policy wording. It isn't advice. Your policy documents decide what's covered."
        Rate limit: the AI limit (15 burst, ~6/min) for every action. Usage is logged to `ai_usage`
        (`policy_explainer`, `policy_explainer_summary`).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PolicyExplainInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "201": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /claims:
    get:
      tags: [Claims]
      summary: The customer's claims
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Claims]
      summary: Report a claim to the broker
      description: "Reporting is not approval: show `disclaimer`. Returns the evidence checklist (`requiredEvidence`)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReportClaimInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /claims/{id}:
    get:
      tags: [Claims]
      summary: Claim detail, timeline and documents
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /claims/{id}/withdraw:
    post:
      tags: [Claims]
      summary: Withdraw a claim before the insurer decides
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /claims/{id}/timeline:
    get:
      tags: [Claims]
      summary: Customer-facing journey with expected times
      description: |
        Stages `reported → acknowledged (within 24 h) → assessing (about 5 working days) → decision → payment (within
        10 working days of approval)`, each with `at` (reached) or `expectedBy` / `expectedLabel`, plus `next` (what to expect,
        `overdue`) and the raw events. Never implies approval.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /claims/{id}/messages:
    get:
      tags: [Claims]
      summary: The claim thread (customer, broker, insurer)
      description: Oldest first. Internal partner notes are never returned to customers. `canMessage` says whether the caller may post.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 100 } }
        - { in: query, name: before, schema: { type: string, format: date-time } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Claims]
      summary: Send a message in the claim thread
      description: Attachments reference documents already uploaded with `POST /documents` (`claimId`). Notifies the other parties (push, in-app, email).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClaimMessageInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /claims/{id}/info-requests:
    get:
      tags: [Claims]
      summary: Information the insurer or broker has asked for
      description: "`items[]` of `claim_info_requests` (open first): `kind` document | information | inspection, `message`, `due_at`, `fulfilled_at`, `document_id`, `response`."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /claims/{id}/info-requests/{reqId}/fulfil:
    post:
      tags: [Claims]
      summary: Answer an information request
      description: Link a document uploaded with `POST /documents` (`claimId`) and/or reply in writing. The requester is notified.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { in: path, name: reqId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FulfilInfoRequestInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /claims/{id}/video:
    post:
      tags: [Claims]
      summary: Upload a short video of the damage or scene
      description: |
        ≤ 90 seconds and ≤ 50 MB; MP4, WebM or QuickTime. JSON with base64 `content`, or `multipart/form-data` with a `file`
        part and the same field names. Measure `durationSeconds` on the device (the server rejects longer clips).
        Stored as a `claim_video` document under `documents/{customerId}/claims/{claimId}/video-….`
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ClaimVideoUploadInput" } }
          multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary }, durationSeconds: { type: integer }, caption: { type: string } } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
  /claims/{id}/jobs:
    get:
      tags: [Claims]
      summary: Repairs, towing and treatment arranged on the claim
      description: Each job carries the partner's name, address and phone, `status` (requested → accepted → in_progress → completed | cancelled) and `direct_billing` (the insurer settles with the partner; the customer pays nothing upfront).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /service-partners:
    get:
      tags: [Claims]
      summary: Approved post-claim partner directory (public)
      description: Garages, towing, hospitals, clinics, pharmacies and assessors by `kind` and `region`. Pass `insurerOrgId` to get `directBilling` per partner.
      security: []
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [garage, towing, hospital, clinic, pharmacy, assessor] } }
        - { in: query, name: region, schema: { type: string } }
        - { in: query, name: insurerOrgId, schema: { type: string, format: uuid } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 100, maximum: 200 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /complaints:
    get:
      tags: [Complaints]
      summary: The customer's complaints
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Complaints]
      summary: File a complaint (routed to the broker, insurer or platform; SLA from settings)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FileComplaintInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }

  /notifications:
    get:
      tags: [Notifications & devices]
      summary: In-app notifications (with `deepLink` for the app) and unread count
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Before" }, { name: unread, in: query, schema: { type: string, enum: ["true", "false"] } }]
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /notifications/read:
    post:
      tags: [Notifications & devices]
      summary: Mark notifications read
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { ids: { type: array, items: { type: string, format: uuid }, maxItems: 200 }, all: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /devices:
    post:
      tags: [Notifications & devices]
      summary: Register an Expo push token (moves the token to this user if it existed)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterDeviceInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
  /devices/{token}:
    delete:
      tags: [Notifications & devices]
      summary: Unregister a push token (URL-encode it). Call on sign-out.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /ai/assistant:
    post:
      tags: [AI]
      summary: Streaming customer assistant (AI SDK UI message stream)
      description: |
        Same handler as `/api/ai/assistant`. Use `useChat` with `DefaultChatTransport({ api, headers: { Authorization }, body: { requestId?, policyId?, threadId? } })`.
        The response is a Server-Sent Events UI message stream (`x-vercel-ai-ui-message-stream: v1`), not an ApiResult.
        Response header `x-thread-id` identifies the stored conversation; pass it back as `threadId`.
        Tools are read-only (policies, request status, quote comparison, glossary, needs assessment, draft message to broker — never sends).
        Rate limit: 15 burst, ~6/min. 503 `unavailable` when the `ai_assistant` flag is off.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssistantRequest" } } }
      responses:
        "200": { description: UI message stream, content: { text/event-stream: { schema: { type: string } } } }
        "503": { $ref: "#/components/responses/Error" }

  /partner/requests:
    get:
      tags: [Partner API]
      summary: Requests routed to the broker, or submitted to the insurer (scope requests:read)
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Before" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RequestStatus" } }
        - { name: updatedSince, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /partner/quotes:
    post:
      tags: [Partner API]
      summary: Post a quote for a request (scope quotes:write)
      description: Brokers quote for appointed insurers on their routed requests; insurers quote only for themselves on requests submitted to them. A `ready_to_accept` quote moves the request to `quotes_ready` and notifies the customer.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BrokerQuoteInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /partner/policies/{id}/issue:
    post:
      tags: [Partner API]
      summary: Issue a pending policy — activates cover (insurer keys only, scope policies:issue)
      description: Requires a confirmed payment. Records `policy_active` usage, completes the request and notifies the customer.
      security: [{ apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IssuePolicyBody" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /partner/claims/{id}/status:
    post:
      tags: [Partner API]
      summary: Update a claim's status or decision (insurer keys only, scope claims:write)
      security: [{ apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PartnerClaimStatusInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }

  /partner/offers:
    get:
      tags: [Partner API]
      summary: Requests offered to the broker (claim model, Addendum 2 D2/E)
      description: |
        Open offers by default (`status=offered`, soonest deadline first). Works with a broker member's bearer token
        (RLS limits rows to their organisations) or a broker API key (scope `requests:read`). Each open item carries
        `acceptUrl` (web one-tap link `/partner/offers/accept/{token}`) and `deepLink` (`covva://offers/accept/{token}`).
        The customer's identity is only shared once the offer is accepted; `request.risk_data` is available to decide.
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Before" }
        - { name: status, in: query, schema: { type: string, enum: [offered, accepted, declined, expired, withdrawn], default: offered } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "401": { $ref: "#/components/responses/Error" }
  /partner/offers/{id}:
    post:
      tags: [Partner API]
      summary: Accept or decline an offered request
      description: |
        `accept` makes the organisation the broker of record (first to accept wins; every other open offer is withdrawn;
        a second accept returns 422). `decline` passes the request on; when the whole round has declined it is re-offered
        at once, otherwise when the timer expires (`routing.offer_timeout_minutes`, default 30). Callers must be an
        adviser/supervisor/admin/owner of the offered broker (bearer) or use that broker's API key (scope `requests:read`).
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OfferResponseInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }


  # --- Broker workspace on mobile (Addendum 4 §2) — also usable by insurer users on the web client and by partner keys ---
  /partner/dashboard:
    get:
      tags: [Partner API]
      summary: Workspace dashboard — KPIs, commission summary and open work counts
      description: |
        Sales funnel for the range (`days` = 7, 30 or 90; per-day `series` for sparklines), renewals due in 30 days,
        claims summary, SLA performance, lapses, the current month's commission (only for owners/admins/finance or
        keys with `finance:read`; otherwise `commission` is null and `commissionVisible` false) and counts of open
        offers / requests / submissions / claims. Dual-membership users pick the organisation with `orgId` (or the
        `X-Covva-Org` header); otherwise the stored `activeWorkspace` or the only partner membership is used.
        Insurer workspaces are refused on `X-Covva-Client: mobile` (`details.reason = insurer_web_only`).
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/PartnerDashboard" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /partner/renewals:
    get:
      tags: [Partner API]
      summary: Policies due for renewal within N days (scope policies:read)
      description: |
        Active policies of the organisation ending within `days` (default 30, max 365), soonest first, with the
        customer's display name, `contactAllowed` (latest data-sharing consent for your organisation type),
        `marketingAllowed` and the renewal request if one exists. Brokers (broker of record) get full names and
        contact details; insurer users get first name + initial and no contact details.
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200":
          description: Renewals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          windowDays: { type: integer }
                          count: { type: integer }
                          items: { type: array, items: { $ref: "#/components/schemas/RenewalItem" } }
                          note: { type: string }
        "403": { $ref: "#/components/responses/Error" }
  /partner/commission:
    get:
      tags: [Partner API]
      summary: Commission summary for a month (owners/admins/finance; scope finance:read)
      description: Earned (brokers) or payable (insurers) from the ledger, `paid` from statements marked paid, `outstanding` = earned − paid. Period defaults to the current month.
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: period, in: query, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-10" } }
      responses:
        "200":
          description: Commission
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/CommissionSummary" } }
        "403": { $ref: "#/components/responses/Error" }
  /partner/statements:
    get:
      tags: [Partner API]
      summary: Settlement statements, newest period first (owners/admins/finance; scope finance:read)
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 24 } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "403": { $ref: "#/components/responses/Error" }
  /partner/statements/{id}:
    get:
      tags: [Partner API]
      summary: One statement with its ledger lines and a 10-minute PDF link when rendered
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/OrgId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /partner/claims:
    get:
      tags: [Partner API]
      summary: Claims the organisation assists (brokers) or decides (insurers) (scope claims:read)
      description: Newest first. `view=open` (default) hides decided/closed claims; `status` filters one status. Each item carries `statusLabel` and `customerName` (initials only for insurers).
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: view, in: query, schema: { type: string, enum: [open, decided, all], default: open } }
        - { name: status, in: query, schema: { type: string, enum: [draft, reported, delivered_to_insurer, acknowledged, under_assessment, info_requested, approved, partially_approved, rejected, paid, closed, withdrawn] } }
        - { name: policyId, in: query, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Before" }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "403": { $ref: "#/components/responses/Error" }
  /partner/claims/{id}/updates:
    post:
      tags: [Partner API]
      summary: Broker records a claim step or a note from the app
      description: |
        Same rules as the web claims desk: a broker (owner/admin/supervisor/adviser) may mark a claim
        `delivered_to_insurer` and, only while the insurer hasn't acted on it, `acknowledged` / `under_assessment` /
        `info_requested`; otherwise send a note only. Decisions are insurer-only (`POST /partner/claims/{id}/status`).
        Notifies the customer (push) when the status changes or the note is visible to them.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PartnerClaimUpdateInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /partner/claims/{id}/info-requests:
    get:
      tags: [Partner API]
      summary: Information requests on a claim the organisation services
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/OrgId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Partner API]
      summary: Ask the customer (or the broker) for a document, information or an inspection slot
      description: |
        Brokers (owner/admin/supervisor/adviser) and insurer claims teams. The requested party is notified (customers by push,
        in-app, email and SMS) and can answer from the claim page or `POST /claims/{id}/info-requests/{reqId}/fulfil`.
        Insurers may set `setStatus: true` to move the claim to `info_requested` in the same call.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClaimInfoRequestInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /partner/claims/{id}/jobs:
    get:
      tags: [Partner API]
      summary: Jobs arranged on a claim
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/OrgId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Partner API]
      summary: Assign an approved service partner to the claim
      description: "`directBilling: true` is only accepted when the partner direct-bills the claim's insurer (`GET /service-partners?insurerOrgId=`). The customer is notified with the partner's contact details."
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClaimJobInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Partner API]
      summary: Track a job (status, estimate, invoice, schedule)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateClaimJobInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /partner/customers:
    get:
      tags: [Partner API]
      summary: The broker's clients (brokers only; scope requests:read)
      description: Active `customer_broker_assignments` plus customers whose requests or policies name the organisation as broker of record. Insurer workspaces get `403 forbidden`.
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: q, in: query, description: Name, email, phone or business name contains, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/ClientSummary" } }
                          total: { type: integer }
                          limit: { type: integer }
                          offset: { type: integer }
                          nextOffset: { type: [integer, "null"] }
        "403": { $ref: "#/components/responses/Error" }
  /partner/customers/{id}:
    get:
      tags: [Partner API]
      summary: One client with policies, requests, claims and assignment history (brokers only)
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/OrgId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /partner/documents:
    post:
      tags: [Partner API]
      summary: Upload a document from the phone camera in one call
      description: |
        Policy schedules, certificates, IDs and claim evidence for a request, policy or claim the organisation
        services. Send JSON with base64 `content` (plain or `data:` URL) or `multipart/form-data` with a `file`
        part and the same field names. Max 20 MB; PDF, JPEG, PNG, WebP, HEIC or Word. Creates the `documents` row,
        a `document_uploaded` request event, and tells the customer when a policy document is added to their wallet.
        The two-step flow (`/documents/upload-url` → `/documents`) is still available for large files.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/PartnerDocumentUploadInput" } }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                fileName: { type: string }
                mimeType: { type: string }
                kind: { $ref: "#/components/schemas/DocumentKind" }
                requestId: { type: string, format: uuid }
                policyId: { type: string, format: uuid }
                claimId: { type: string, format: uuid }
                taskId: { type: string, format: uuid }
                deliveredToInsurer: { type: boolean }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /partner/messages:
    get:
      tags: [Partner API]
      summary: A request thread as the servicing organisation (oldest first, with internal notes)
      description: Marks the customer's messages as read by the broker. Customers use `GET /requests/{id}/messages`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: request_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/OrgId" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { $ref: "#/components/parameters/Before" }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [Partner API]
      summary: Message the customer on a request (push + in-app + email), or add an internal note
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PartnerMessageInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /partner/profile:
    get:
      tags: [Partner API]
      summary: Organisation profile, the caller's role and insurer/broker links (appointments)
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/PartnerProfile" } }
    patch:
      tags: [Partner API]
      summary: Update contact details (owners and admins)
      description: Only `contactEmail`, `contactPhone`, `website`, `address`, `region` and `description`. Licence and legal details change through registration or Covva admin.
      security: [{ bearerAuth: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePartnerProfileInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }

  /fx:
    get:
      tags: [Diaspora payments]
      security: []
      summary: Indicative FX display rates (GHS per 1 unit) and the disclosure text
      description: |
        Diaspora payers see the GHS premium in GBP, USD, EUR or CAD. Rates are indicative (source and time
        are returned; `manual` rates are flagged); the insurer always receives the GHS contract amount and the
        card issuer / PSP applies the final rate. `amount` (GHS) returns a full `quote` with the disclosure.
      parameters:
        - { name: currency, in: query, schema: { type: string, enum: [GHS, GBP, USD, EUR, CAD], default: GHS } }
        - { name: amount, in: query, description: GHS amount to convert (indicative), schema: { type: number } }
      responses:
        "200":
          description: Rates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/FxRates" } }
  /subscriptions:
    get:
      tags: [Diaspora payments]
      summary: The caller's sponsor subscriptions and saved payment methods (no card numbers)
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/SponsorSubscription" } }
                          paymentMethods: { type: array, items: { $ref: "#/components/schemas/PaymentMethod" } }
    post:
      tags: [Diaspora payments]
      summary: Start recurring premium collections for a policy the caller pays for
      description: |
        Every collection is a GHS premium payment to the insurer (same split/ledger as a checkout), charged to the
        sponsor's saved card on the cadence; the foreign amount is indicative. Needs a saved method — pay once by
        card with `saveMethod: true` (or `sponsorSubscription` on `POST /payments`, which creates the subscription
        automatically after the first payment). Monthly collections on a yearly quote need the insurer to allow instalments.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSubscriptionInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/pause:
    post:
      tags: [Diaspora payments]
      summary: Pause collections (cover may lapse when a premium falls due)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/cancel:
    post:
      tags: [Diaspora payments]
      summary: Cancel collections; existing cover runs to its end date
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /bundles:
    get:
      tags: [Diaspora payments]
      security: []
      summary: Published product bundles (e.g. the Parents' Care Pack) with an indicative GHS estimate
      description: Each item becomes its own request/quote/policy; the discount is confirmed by the insurer on the binding quotes. `getStartedUrl` opens the web flow with `?bundle=`.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /property/{policyId}/updates:
    get:
      tags: [Diaspora payments]
      summary: Construction / site photo updates on a property policy
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Diaspora payments]
      summary: Record a site photo already uploaded with POST /documents/upload-url (scope policies)
      description: Customer or sponsor of the policy only (RLS). The photo is visible to the broker and insurer.
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PropertyUpdateInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
  /property/{policyId}/inspections:
    get:
      tags: [Diaspora payments]
      summary: Partner site inspections on a property policy (status, visit date, report)
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Diaspora payments]
      summary: Ask for a partner site inspection (customer or sponsor)
      description: Covva assigns an inspection partner; the partner schedules and files the report; the INSURER decides what it means for cover. One open inspection per policy.
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestInspectionInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }

  /verify:
    get:
      tags: [Verification]
      summary: Public policy check (QR code or insurer + policy number)
      description: |
        Unauthenticated and rate-limited (30 per IP, refilling slowly). Pass `code` (the 10-character
        verification code from a wallet QR / `verifyUrl`) **or** `insurer` (organisation slug) + `policyNumber`.
        Returns only non-personal fields: valid, status, insurerName, categoryName, coverStart, coverEnd and
        policyNumberMasked (last 4). A "not found" result is not proof that a risk is uninsured — the policy may
        have been bought outside Covva.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{10}$" } }
        - { name: insurer, in: query, description: Insurer organisation slug, schema: { type: string } }
        - { name: policyNumber, in: query, schema: { type: string, minLength: 3 } }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties:
                      data:
                        type: object
                        required: [valid]
                        properties:
                          valid: { type: boolean }
                          status: { type: string, description: "active | outside cover dates | pending issuance | cancelled | expired | …" }
                          insurerName: { type: string }
                          categoryName: { type: string }
                          coverStart: { type: [string, "null"], format: date }
                          coverEnd: { type: [string, "null"], format: date }
                          policyNumberMasked: { type: [string, "null"], description: "Last 4 characters visible" }
                          message: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /family/beneficiaries:
    get:
      tags: [Family (diaspora)]
      summary: Family members the caller looks after
      description: Ghana Card numbers are masked (`ghana_card_masked`); `has_account` tells whether the beneficiary signed up with that phone.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Family (diaspora)]
      summary: Add a family member in Ghana
      description: Phone must be a Ghana number (normalised to +233…). Consent starts `pending`; send a code next.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateBeneficiaryInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /family/beneficiaries/{id}:
    get:
      tags: [Family (diaspora)]
      summary: One family member with their consent records
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    patch:
      tags: [Family (diaspora)]
      summary: Edit a family member (changing the phone resets consent)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateBeneficiaryInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /family/beneficiaries/{id}/consent:
    post:
      tags: [Family (diaspora)]
      summary: Send a consent code (and signed link) to the beneficiary's phone
      description: |
        The 6-digit code goes to the **beneficiary** by SMS or WhatsApp together with a signed `/consent/{token}` link;
        it is never returned to the sponsor. Codes last 15 minutes, links 7 days. Rate limited.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/RequestConsentInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "429": { $ref: "#/components/responses/Error" }
  /family/beneficiaries/{id}/consent/confirm:
    post:
      tags: [Family (diaspora)]
      summary: Confirm with the code the beneficiary read out
      description: 5 attempts, then the code is locked until a new one is sent (`422 business_rule`).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmConsentInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /family/dashboard:
    get:
      tags: [Family (diaspora)]
      summary: Family dashboard
      description: Beneficiaries (+ consents), sponsorships, policies paid for, next renewal, payment schedule (one-off payments and recurring sponsor subscriptions), claims and `summary`.
      responses:
        "200": { description: Dashboard, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { $ref: "#/components/schemas/FamilyDashboard" } } }] } } } }
  /family/sponsorships:
    get:
      tags: [Family (diaspora)]
      summary: The caller's sponsorships
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Family (diaspora)]
      summary: Link the payer to a beneficiary and a request or policy (optionally as a gift)
      description: Needs the beneficiary's `data_sharing` consent. Becomes `active` once the policy exists. One sponsorship per policy.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSponsorshipInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /family/sponsorships/{id}/reveal:
    post:
      tags: [Family (diaspora)]
      summary: Open a gift (beneficiary's linked account)
      description: Records `gift_revealed_at` and returns `gift_message`. The sponsor cannot call this.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /family/claims:
    post:
      tags: [Family (diaspora)]
      summary: Report a claim on behalf of a beneficiary (claims by proxy)
      description: Needs an active sponsorship and the beneficiary's `proxy_claims` consent; `422` otherwise. The claim stays the policyholder's (`reported_by_user_id` = sponsor). Reporting is not approval.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProxyClaimInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /distribution/quotes:
    post:
      tags: [Distribution]
      summary: Indicative estimates for a risk payload
      description: "Scope `distribution:quote`. Prices the partial risk with every approved product in the category (insurer-approved rating rules). Nothing is stored or bound. `fields` lists the 3–5 inputs the widget asks for; `continueUrl` opens Covva with your referral code."
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DistributionQuoteInput" } } }
      responses:
        "200":
          description: Estimates
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { $ref: "#/components/schemas/DistributionQuoteResult" } } }] } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /distribution/leads:
    post:
      tags: [Distribution]
      summary: Hand a consenting customer over to Covva
      description: "Scope `distribution:lead`. Stores the lead with your consent record, opens an attribution (`source: api`) and sends the customer a link to continue on Covva by SMS and/or email. The customer signs up on Covva; you never collect payment."
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DistributionLeadInput" } } }
      responses:
        "201":
          description: Lead created
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { $ref: "#/components/schemas/DistributionLeadResult" } } }] } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /distribution/referrals:
    get:
      tags: [Distribution]
      summary: Your referrals, conversions and revenue share
      description: "Scope `distribution:read`. Customer details are limited to a first name and a masked phone."
      security: [{ apiKey: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Report
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { $ref: "#/components/schemas/DistributionReferralReport" } } }] } } }
        "403": { $ref: "#/components/responses/Error" }
  /me/referrals:
    get:
      tags: [Referrals]
      summary: My referral link, friends who joined (anonymous) and credits
      description: "Credits are GHS credit units, not cash — redeemable only against Covva platform fees or an insurer-funded premium discount. `programmeActive` is false until the reward rule is approved and switched on."
      responses:
        "200":
          description: Summary
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { $ref: "#/components/schemas/MyReferrals" } } }] } } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [Referrals]
      summary: Create (or return) my personal referral link
      responses:
        "200":
          description: Summary (with the link)
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { $ref: "#/components/schemas/MyReferrals" } } }] } } }
        "401": { $ref: "#/components/responses/Error" }

  /business:
    get:
      tags: [Business accounts]
      summary: My business accounts and my own workplace cover
      description: "`accounts[]` (orgId, name, role, profile) plus `workplaceCover[]` — schemes the caller is a member of (linked automatically when they sign in with the census phone number)."
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Business accounts]
      summary: Create a business account (the caller becomes its owner)
      description: Up to 5 owned business accounts per user (`422` beyond).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateBusinessInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Error" }
  /business/{orgId}/dashboard:
    get:
      tags: [Business accounts]
      summary: Business dashboard
      description: Schemes, member / fleet / asset counts, renewals in the next 60 days, statements due, open requests and employee claim counts (counts only).
      parameters: [{ $ref: "#/components/parameters/BusinessOrgId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /business/{orgId}/members:
    get:
      tags: [Business accounts]
      summary: Schemes with census summaries (and members for owners/admins)
      description: "`members` is `null` for finance and viewer roles — they see counts only."
      parameters:
        - { $ref: "#/components/parameters/BusinessOrgId" }
        - { name: schemeId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Business accounts]
      summary: Add a member to a scheme (owner/admin)
      description: Phone is normalised to +233…; only the last 4 Ghana Card digits are stored. Dependants need `principal_member_id`.
      parameters: [{ $ref: "#/components/parameters/BusinessOrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddSchemeMemberInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /business/{orgId}/members/import:
    post:
      tags: [Business accounts]
      summary: Upload a census CSV (preview or import)
      description: |
        `mode=preview` validates only and returns `{ valid, errors: [{ row, message }], preview[] }`; `mode=import` inserts the
        valid rows (employees first, then dependants by `principal_ref`). Invalid rows are never partially imported. Columns:
        employee_ref, full_name, date_of_birth, gender, phone, email, ghana_card, relationship, principal_ref, cover_tier, salary_band.
      parameters: [{ $ref: "#/components/parameters/BusinessOrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ImportSchemeMembersInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
  /business/{orgId}/fleet:
    get:
      tags: [Business accounts]
      summary: Active fleet vehicles
      parameters: [{ $ref: "#/components/parameters/BusinessOrgId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [Business accounts]
      summary: Add a vehicle, or upload a fleet CSV (`{ csv, mode }`)
      description: Registrations are normalised (GR123423 → "GR 1234-23"); duplicates are row errors.
      parameters: [{ $ref: "#/components/parameters/BusinessOrgId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddFleetInput" } } }
      responses:
        "200": { description: CSV preview / import report, content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } } }
        "201": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
  /business/{orgId}/invoices:
    get:
      tags: [Business accounts]
      summary: Consolidated statements
      description: "Each statement has `lines[]` ({ description, amount, insurer_org_id, insurer_name, basis, payment_id, payment_status }). Built on the 1st of each month for the previous month."
      parameters: [{ $ref: "#/components/parameters/BusinessOrgId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /business/invoices/{id}/pay:
    post:
      tags: [Business accounts]
      summary: Pay a statement — one payment per insurer line (owner/admin/finance)
      description: |
        Returns `results[]` per line: `status`, `paymentId`, `reference`, `authorizationUrl` (open it for card / hosted MoMo),
        `message`. New cover goes through checkout; instalments through the insurer's schedule; premiums the insurer collects
        directly come back as `not_collected`. Every payment settles to that insurer.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PayBusinessInvoiceInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /openapi:
    get:
      tags: [System]
      summary: This document (YAML)
      security: []
      responses:
        "200": { description: OpenAPI document, content: { application/yaml: { schema: { type: string } } } }

  /policies/{id}/instalments:
    get:
      tags: [Instalments & micro cover]
      summary: The policy's instalment schedule (null when paid in full)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { type: object, properties: { schedule: { oneOf: [{ $ref: "#/components/schemas/InstalmentSchedule" }, { type: "null" }] } } } }
        "404": { $ref: "#/components/responses/Error" }
  /instalments/{id}/pay:
    post:
      tags: [Instalments & micro cover]
      summary: Pay an instalment now (earlier unpaid instalments are included)
      description: "`mobile_money` pushes a prompt the payer approves; `card` charges the saved card; `link` returns a hosted checkout URL. Lapsed schedules use the reinstate endpoint."
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PayInstalmentInput" } } } }
      responses:
        "200": { description: Collection started, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { $ref: "#/components/schemas/CollectResult" } } }] } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /instalments/schedules/{id}/reinstate:
    post:
      tags: [Instalments & micro cover]
      summary: Reinstate a lapsed schedule by paying the arrears (within the insurer's window)
      description: When the plan requires it, the insurer reviews the reinstatement after the arrears are paid (`requiresReview`); a declined reinstatement is refunded.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PayInstalmentInput" } } } }
      responses:
        "200": { description: Collection started, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { allOf: [{ $ref: "#/components/schemas/CollectResult" }, { properties: { requiresReview: { type: boolean } } }] } } }] } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /micro/products:
    get:
      tags: [Instalments & micro cover]
      summary: Published micro products with "from GH₵ X/day" prices (no auth)
      security: []
      parameters:
        - { name: audience, in: query, required: false, schema: { type: string, enum: [okada, trotro, ride_hailing, trader, artisan, event] } }
      responses:
        "200": { description: Products, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/OkEnvelope" }, { properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/MicroProduct" } } } } } }] } } } }
  /micro/buy:
    post:
      tags: [Instalments & micro cover]
      summary: One-step micro purchase (request + quote + application + payment)
      description: |
        Instant (delegated L2) products are sold insurer-direct: the response has `mode: instant` and the payment
        (MoMo prompt to approve, or `authorizationUrl` for card). Other products return `mode: routed` with the
        request a broker / the insurer quotes.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MicroBuyInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /micro/{policyId}/renew:
    post:
      tags: [Instalments & micro cover]
      summary: One-tap renewal; the next window starts when the current one ends
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MicroRenewInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /micro/{policyId}:
    patch:
      tags: [Instalments & micro cover]
      summary: Turn auto-renew on or off
      parameters: [{ name: policyId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [autoRenew], properties: { autoRenew: { type: boolean } } } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /i18n/{locale}:
    get:
      tags: [Localisation]
      summary: Approved UI translations for a locale (public, cached)
      description: |
        The merged, human-approved catalogue for `en`, `tw` (Twi), `gaa` (Ga) or `ee` (Ewe); aliases such as `ga`, `twi`
        and `en-GH` are accepted. `messages` holds only the translated keys — clients bundle the English source
        catalogue and fall back to it for every missing key (`fallback: "en"`). `status` is measured from what is
        approved: `planned` (nothing yet), `partial`, `complete`. Nothing is machine-translated. Cached for up to an hour;
        re-fetch on app start or when the user changes language.
      security: []
      parameters: [{ name: locale, in: path, required: true, schema: { type: string, examples: [tw, gaa, ee, en] } }]
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { $ref: "#/components/schemas/LocaleCatalogue" } }
        "404": { $ref: "#/components/responses/Error" }
  /me/locale:
    put:
      tags: [Localisation]
      summary: Save the signed-in user's preferred language (profiles.locale)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [locale], properties: { locale: { type: string, examples: [tw] } } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /voice-notes:
    post:
      tags: [Voice notes]
      summary: Upload a voice note (≤ 120 s, ≤ 10 MB) for quote help, a claim description or support
      description: |
        `multipart/form-data` with a `file` field, or JSON with `audioBase64` + `mimeType` (mobile). Accepted audio:
        webm, ogg, mpeg (mp3), mp4/m4a, aac, wav. The transcript is produced asynchronously — poll
        `GET /voice-notes/{id}` until `transcriptStatus` is `done` or `failed`. Show it to the user labelled
        "Automatic transcript — please check", let them edit it, and only then copy it into the claim/request text.
        Never submit a transcript automatically. Twi, Ga and Ewe accuracy is limited.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string, enum: [quote_help, claim_description, support] }
                durationSeconds: { type: number, maximum: 130 }
                languageHint: { type: string, enum: [en, tw, gaa, ee] }
                requestId: { type: string, format: uuid }
                claimId: { type: string, format: uuid }
          application/json: { schema: { $ref: "#/components/schemas/VoiceNoteUploadJson" } }
      responses:
        "201":
          description: Saved; transcript pending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { type: object, properties: { voiceNote: { $ref: "#/components/schemas/VoiceNote" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /voice-notes/{id}:
    get:
      tags: [Voice notes]
      summary: A voice note's status, transcript and a 10-minute audio link (owner, linked parties, staff)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Voice note
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkEnvelope"
                  - properties: { data: { type: object, properties: { voiceNote: { $ref: "#/components/schemas/VoiceNote" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Voice notes]
      summary: The owner corrects the transcript
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [transcript], properties: { transcript: { type: string, maxLength: 10000 } } } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

webhooks:
  request.created:
    post:
      tags: [Webhooks]
      summary: A request was routed to the broker of record
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  request.status_changed:
    post:
      tags: [Webhooks]
      summary: A request changed status (data.from_status, data.status)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  quote.ready:
    post:
      tags: [Webhooks]
      summary: Quotes were sent to the customer, or a binding quote was posted
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  application.submitted:
    post:
      tags: [Webhooks]
      summary: The customer applied for a quote
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  payment.succeeded:
    post:
      tags: [Webhooks]
      summary: Premium confirmed by the payment provider (policy pending issuance — not active)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  policy.issued:
    post:
      tags: [Webhooks]
      summary: The insurer issued the policy; cover is active
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  claim.reported:
    post:
      tags: [Webhooks]
      summary: A claim was reported (reporting is not approval)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  claim.status_changed:
    post:
      tags: [Webhooks]
      summary: A claim changed status
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  complaint.filed:
    post:
      tags: [Webhooks]
      summary: A complaint owned by your organisation was filed
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  referral.converted:
    post:
      tags: [Webhooks]
      summary: A customer you referred now has an active policy (distribution partners)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  referral.rewarded:
    post:
      tags: [Webhooks]
      summary: Revenue share (from Covva's platform fee) accrued for a converted referral
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }
  test.ping:
    post:
      tags: [Webhooks]
      summary: Test delivery sent from the settings page
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/WebhookEnvelope" } } } }
      responses: { "2xx": { description: Acknowledged } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token (JWT)
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: "Partner key `imk_<prefix>_<secret>`; the platform stores only sha256(key)."

  parameters:
    CovvaClient:
      name: X-Covva-Client
      in: header
      required: false
      description: Which client is calling. Missing = `web`. Insurer and staff accounts are refused on `mobile`.
      schema: { type: string, enum: [mobile, web, partner-web], default: web }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    BusinessOrgId: { name: orgId, in: path, required: true, description: Business account (enterprise organisation) id, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Before: { name: before, in: query, description: Cursor (ISO timestamp from `nextCursor`), schema: { type: string, format: date-time } }
    OrgId: { name: orgId, in: query, required: false, description: "Organisation to act for when the user belongs to several (also accepted as the `X-Covva-Org` header). Defaults to the stored active workspace or the only partner membership.", schema: { type: string, format: uuid } }

  responses:
    Ok:
      description: Success
      content: { application/json: { schema: { $ref: "#/components/schemas/OkEnvelope" } } }
    Page:
      description: A page of items
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/OkEnvelope"
              - properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { type: object } }
                      nextCursor: { type: [string, "null"], format: date-time }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Me:
      description: Current user
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/OkEnvelope"
              - properties:
                  data:
                    type: object
                    properties:
                      profile: { type: object, description: "profiles row; Ghana Card returned as ghana_card_last4 only" }
                      memberships: { type: array, items: { type: object } }
                      isPartner: { type: boolean }
                      workspaces: { type: array, items: { $ref: "#/components/schemas/Workspace" }, description: "Customer workspace first, then one per broker/insurer membership" }
                      activeWorkspace: { $ref: "#/components/schemas/ActiveWorkspace" }
                      client: { type: string, enum: [mobile, web, partner-web], description: "Echo of X-Covva-Client" }
                      flags: { type: object, additionalProperties: { type: boolean }, description: "feature_flags (e.g. demo_mode, ai_assistant)" }
                      consents: { type: object, additionalProperties: { type: object } }
                      versions: { type: object, properties: { terms: { type: [string, "null"] }, privacy: { type: [string, "null"] } } }
                      needsConsent: { type: boolean }

  schemas:
    Workspace:
      type: object
      required: [type, mobileAllowed, allowed]
      properties:
        type: { type: string, enum: [customer, broker, insurer] }
        orgId: { type: string, format: uuid }
        orgName: { type: string }
        role: { type: string, description: "member_role (owner, admin, supervisor, adviser, underwriter, claims_officer, finance, viewer)" }
        mobileAllowed: { type: boolean, description: "Usable from the mobile app (false for insurer workspaces)" }
        allowed: { type: boolean, description: "Usable from the calling client" }
    ActiveWorkspace:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [customer, broker, insurer] }
        orgId: { type: string, format: uuid }
    SetActiveWorkspaceInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [customer, broker, insurer] }
        orgId: { type: string, format: uuid, description: "Required unless type is customer" }
    OkEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data: {}
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: Safe to show to users }
            details: {}
    ErrorCode:
      type: string
      enum: [unauthorised, forbidden, not_found, invalid_input, business_rule, conflict, rate_limited, unavailable, internal_error]

    RequestStatus:
      type: string
      enum: [draft, submitted, awaiting_customer_info, adviser_action, insurer_response, quotes_ready, payment_confirmation, policy_documents, completed, cancelled, closed_no_cover]
    QuoteStatus:
      type: string
      enum: [estimate, awaiting_underwriting, ready_to_accept, accepted, expired, declined, withdrawn]
    PolicyStatus:
      type: string
      enum: [pending_issuance, active, lapsed, cancelled, expired, renewed]
    ClaimStatus:
      type: string
      enum: [draft, reported, delivered_to_insurer, acknowledged, under_assessment, info_requested, approved, partially_approved, rejected, paid, closed, withdrawn]
    ComplaintStatus:
      type: string
      enum: [open, acknowledged, investigating, resolved, escalated_nic, closed]
    PaymentStatus:
      type: string
      enum: [pending, processing, succeeded, failed, refunded, reversed, abandoned]
    CategoryAvailability:
      type: string
      enum: [integrated, broker_assisted, planned]
    DocumentKind:
      type: string
      enum: [id_document, vehicle_registration, drivers_licence, photo, proof_of_address, medical, policy_schedule, certificate, policy_wording, receipt, endorsement, claim_evidence, police_report, invoice, other]
    ConsentType:
      type: string
      enum: [terms, privacy, marketing, data_sharing_broker, data_sharing_insurer, ai_assistance]

    RiskField:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, number, currency, select, multiselect, boolean, date, region] }
        required: { type: boolean }
        min: { type: number }
        max: { type: number }
        placeholder: { type: string }
        help: { type: string }
        options: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        short_description: { type: [string, "null"] }
        icon: { type: [string, "null"], description: lucide icon name }
        segment: { type: string, enum: [personal, business, specialist] }
        availability: { $ref: "#/components/schemas/CategoryAvailability" }
        availabilityLabel: { type: string }
        availabilityPromise: { type: string }
        risk_schema: { type: array, items: { $ref: "#/components/schemas/RiskField" } }
        required_documents: { type: array, items: { $ref: "#/components/schemas/DocumentKind" } }
        regulatory_note: { type: [string, "null"] }
        default_sla_hours: { type: integer }

    UpdateProfileInput:
      type: object
      properties:
        fullName: { type: string, maxLength: 200 }
        preferredName: { type: [string, "null"] }
        phone: { type: [string, "null"], pattern: "^\\+?\\d{9,15}$" }
        accountType: { type: string, enum: [individual, business] }
        businessName: { type: [string, "null"] }
        dateOfBirth: { type: [string, "null"], format: date }
        ghanaCardNumber: { type: [string, "null"], pattern: "^GHA-\\d{9}-\\d$" }
        region: { type: [string, "null"] }
        city: { type: [string, "null"] }
        locale: { type: string }
        avatarUrl: { type: [string, "null"], format: uri }
        notificationPrefs: { type: object, properties: { email: { type: boolean }, sms: { type: boolean }, push: { type: boolean }, whatsapp: { type: boolean } } }
        onboarded: { const: true }
    RecordConsentsInput:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [type, granted]
            properties:
              type: { $ref: "#/components/schemas/ConsentType" }
              granted: { type: boolean }
              version: { type: string }
              context: { type: string }
    NeedsAssessmentInput:
      type: object
      required: [answers]
      properties:
        answers: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: array, items: { type: string } }, { type: boolean }] } }
        anonymousId: { type: string }
    NeedsResult:
      type: object
      properties:
        id: { type: [string, "null"], format: uuid }
        suggestions:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              priority: { type: string, enum: [essential, recommended, consider] }
              why: { type: string }
              availability: { $ref: "#/components/schemas/CategoryAvailability" }
        needsAdviser: { type: boolean }
        adviserReason: { type: [string, "null"] }
        note: { type: string }

    CreateRequestInput:
      type: object
      required: [categorySlug, risk]
      properties:
        categorySlug: { type: string }
        type: { type: string, enum: [new_cover, renewal, switch, endorsement, service], default: new_cover }
        risk: { type: object, additionalProperties: true, description: "Answers keyed by the category's risk_schema field keys" }
        relatedPolicyId: { type: string, format: uuid }
        needsAssessmentId: { type: string, format: uuid }
        submit: { type: boolean, default: true }
        talkToExpert: { type: boolean, default: false, description: "Ask for advice: always routed to a broker, whatever the insurer's integration level" }
    DisclosureAckInput:
      type: object
      properties:
        stage: { type: string, enum: [before_advice, before_application, broker_change], default: before_application }
        method: { type: string, enum: [in_app, sms, email, call], default: in_app }
    PostMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        attachments: { type: array, items: { type: object, required: [documentId, name], properties: { documentId: { type: string, format: uuid }, name: { type: string } } } }
    CompleteTaskInput:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        note: { type: string, maxLength: 1000 }

    Quote:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/QuoteStatus" }
        statusLabel: { type: string }
        statusHint: { type: [string, "null"] }
        is_binding: { type: boolean }
        premium: { type: number }
        taxes: { type: number }
        fees: { type: number }
        currency: { type: string, example: GHS }
        billing_period: { type: string }
        sum_insured: { type: [number, "null"] }
        excess: { type: [number, "null"] }
        coverage: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string }, included: { type: boolean } } } }
        limits: { type: object }
        excesses: { type: object }
        exclusions: { type: array, items: { type: string } }
        key_exclusion: { type: [string, "null"] }
        waiting_period_days: { type: integer }
        optional_benefits: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string }, premium: { type: number } } } }
        valid_until: { type: [string, "null"], format: date-time }
        expired: { type: boolean }
        paid_placement: { type: boolean }
        commission_disclosure: { type: [string, "null"] }
        labels: { type: array, items: { type: string }, description: "Explained labels, e.g. Lowest premium" }
        demo: { type: boolean }
        insurer: { type: object, properties: { id: { type: string }, name: { type: string }, slug: { type: string }, logo_url: { type: [string, "null"] } } }
        product: { type: [object, "null"], properties: { id: { type: string }, name: { type: string }, tier: { type: [string, "null"] } } }
    QuotesResult:
      type: object
      properties:
        request: { type: object }
        broker: { type: [object, "null"] }
        quotes: { type: array, items: { $ref: "#/components/schemas/Quote" } }
        comparison:
          type: object
          properties:
            engineVersion: { type: string }
            insurersCompared: { type: integer }
            productsCompared: { type: integer }
            criteria: { type: object }
            ranked: { type: array, items: { type: object } }
            paidPlacements: { type: array, items: { type: object } }
            materialExclusions: { type: array, items: { type: object } }
            disclaimer: { type: string }
        summary: { type: string }
        disclosure: { type: [string, "null"] }
        comparedAt: { type: string, format: date-time }
        demoMode: { type: boolean }
        demoDisclaimer: { type: [string, "null"] }

    UploadUrlInput:
      type: object
      required: [scope, fileName, mimeType, sizeBytes]
      properties:
        scope: { type: string, enum: [requests, policies, claims, profile] }
        fileName: { type: string, maxLength: 200 }
        mimeType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp, image/heic, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document] }
        sizeBytes: { type: integer, maximum: 20971520 }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        requestId: { type: string, format: uuid }
        policyId: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
    ConfirmUploadInput:
      allOf:
        - $ref: "#/components/schemas/UploadUrlInput"
        - type: object
          required: [path]
          properties:
            path: { type: string }
            checksum: { type: string }

    ApplyInput:
      type: object
      required: [quoteId, declarations, acceptTerms]
      properties:
        quoteId: { type: string, format: uuid }
        declarations: { type: object, additionalProperties: { oneOf: [{ type: boolean }, { type: string }] } }
        selectedBenefits: { type: array, items: { type: string }, description: optional_benefits keys }
        acceptTerms: { const: true }
    InitPaymentRequest:
      type: object
      required: [applicationId]
      properties:
        applicationId: { type: string, format: uuid }
        channel: { type: string, enum: [mobile_money, card, bank_transfer], default: mobile_money }
        callbackUrl: { type: string, format: uri }
        momo:
          type: object
          required: [phone, provider]
          properties:
            phone: { type: string, example: "0244123456" }
            provider: { type: string, enum: [mtn, vod, atl] }
    InitiatePaymentResult:
      type: object
      properties:
        paymentId: { type: string, format: uuid }
        reference: { type: string }
        authorizationUrl: { type: [string, "null"], format: uri }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        displayText: { type: [string, "null"] }
        provider: { type: string, enum: [paystack, hubtel, simulator, bank_transfer] }
        bankTransfer:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/BankTransferInstructions"
    BankTransferInstructions:
      type: object
      required: [bank, accountName, accountNumber, reference, kind, amount, currency, instructions]
      properties:
        bank: { type: string }
        accountName: { type: string }
        accountNumber: { type: string }
        reference: { type: string, description: Quote this on the transfer; it is matched at reconciliation }
        kind: { type: string, enum: [insurer_account, paystack_dva], description: insurer's own account, or a Paystack dedicated virtual account unique to the customer (auto-confirms) }
        amount: { type: number }
        currency: { type: string, example: GHS }
        instructions: { type: string, description: Plain-language instructions to show the customer }
    VehicleLookupInput:
      type: object
      required: [registration]
      properties:
        registration: { type: string, example: "GR 1234-23" }
    VehicleLookupResult:
      type: object
      required: [registration, found]
      properties:
        registration: { type: string, description: Normalised plate }
        found: { type: boolean }
        source: { type: [string, "null"], enum: [dvla, manual, cache, null] }
        data:
          type: [object, "null"]
          properties:
            make: { type: string }
            model: { type: string }
            year: { type: integer }
            body: { type: string }
            colour: { type: string }
            chassis_last4: { type: string }
            engine_cc: { type: integer }
            seats: { type: integer }
            use: { type: string, enum: [private, commercial] }
        fetchedAt: { type: string, format: date-time }
    ShareQuotesInput:
      type: object
      properties:
        channel: { type: string, enum: [link, whatsapp, email], default: link }
        email: { type: string, format: email, description: Recipient for `email` (defaults to the account email) }
    ShareResult:
      type: object
      required: [id, token, url, channel, expiresAt, text, whatsappUrl]
      properties:
        id: { type: string, format: uuid }
        token: { type: string }
        url: { type: string, format: uri, description: Public read-only comparison page }
        channel: { type: string, enum: [link, whatsapp, email] }
        expiresAt: { type: string, format: date-time }
        text: { type: string, description: Plain-text summary (WhatsApp / SMS friendly) }
        whatsappUrl: { type: string, format: uri }
        emailSent: { type: boolean }

    WebhookEnvelope:
      type: object
      required: [id, event, created_at, attempt, org_id, data]
      properties:
        id: { type: string, description: Delivery id (stable across retries — de-duplicate on it) }
        event: { type: string, enum: [request.created, request.status_changed, quote.ready, application.submitted, payment.succeeded, policy.issued, claim.reported, claim.status_changed, complaint.filed, test.ping] }
        created_at: { type: string, format: date-time }
        attempt: { type: integer, minimum: 1, maximum: 5 }
        org_id: { type: string, format: uuid, description: The organisation the endpoint belongs to }
        data:
          type: object
          additionalProperties: true
          description: Ids, references, statuses, amounts and dates only. Never personal data.
          properties:
            request_id: { type: string, format: uuid }
            reference: { type: string }
            status: { type: string }
            from_status: { type: string }
            policy_id: { type: string, format: uuid }
            claim_id: { type: string, format: uuid }
            complaint_id: { type: string, format: uuid }
            payment_id: { type: string, format: uuid }
            application_id: { type: string, format: uuid }
            quote_id: { type: string, format: uuid }
    AddExternalPolicyInput:
      type: object
      required: [categorySlug, policyNumber, coverStart, coverEnd]
      description: Give either `insurerOrgId` (an insurer on the platform) or `insurerName` (any other insurer; stored as `external_insurer_name`, no organisation is created).
      properties:
        categorySlug: { type: string }
        insurerOrgId: { type: string, format: uuid, description: From GET /catalog/insurers }
        insurerName: { type: string, minLength: 2, maxLength: 120, description: Insurer not on the platform, as printed on the policy }
        policyNumber: { type: string }
        coverStart: { type: string, format: date }
        coverEnd: { type: string, format: date }
        premium: { type: number }
        sumInsured: { type: number }
        nickname: { type: string, maxLength: 60 }
        documentId: { type: string, format: uuid }
    RenewalInput:
      type: object
      properties:
        risk: { type: object, additionalProperties: true, description: Defaults to the original request's risk details }
        changes: { type: string, maxLength: 2000, description: "What has changed (posted to the broker)" }

    ReportClaimInput:
      type: object
      required: [policyId, incidentType, incidentAt, description]
      properties:
        policyId: { type: string, format: uuid }
        incidentType: { type: string, example: Accident }
        incidentAt: { type: string, format: date-time }
        location:
          description: Free text, or the phone's location
          oneOf:
            - { type: string, maxLength: 300 }
            - { type: object, properties: { lat: { type: number }, lng: { type: number }, accuracy: { type: number }, address: { type: string, maxLength: 300 } } }
        description: { type: string, minLength: 10, maxLength: 5000 }
        amountClaimed: { type: number }
        policeReportDocumentId: { type: string, format: uuid, description: A police report already uploaded with POST /documents }
    FileComplaintInput:
      type: object
      required: [subject, description, category]
      properties:
        subject: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        category: { type: string, enum: [advice, service, claims, payment, data_privacy, technology, other] }
        againstParty: { type: string, enum: [broker, insurer, platform], default: broker }
        requestId: { type: string, format: uuid }
        policyId: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        desiredOutcome: { type: string, maxLength: 2000 }
    RegisterDeviceInput:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]" }
        platform: { type: string, enum: [ios, android, web] }
        provider: { type: string, enum: [expo, fcm, apns, webpush], default: expo }
        appVersion: { type: string }
    AssistantRequest:
      type: object
      required: [messages]
      properties:
        messages: { type: array, maxItems: 60, items: { type: object, description: "AI SDK UIMessage { id, role, parts }" } }
        requestId: { type: string, format: uuid }
        policyId: { type: string, format: uuid }
        threadId: { type: string, format: uuid }

    PolicyExplainInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [clauses, summary, ask, handoff] }
        question: { type: string, minLength: 3, maxLength: 500, description: Required for ask and handoff }
        clauseIds: { type: array, maxItems: 12, items: { type: string, maxLength: 80 }, description: "handoff: the clause ids shown with the answer" }
        logId: { type: string, format: uuid, description: "handoff: the logId returned by ask" }
      examples:
        - { action: ask, question: "What is my excess?" }
        - { action: handoff, question: "Should I add the excess protector?", clauseIds: [benefit.excess-protector, schedule.excess] }

    BrokerQuoteInput:
      type: object
      required: [requestId, insurerOrgId, status, premium]
      properties:
        requestId: { type: string, format: uuid }
        insurerOrgId: { type: string, format: uuid }
        productVersionId: { type: string, format: uuid }
        status: { type: string, enum: [estimate, awaiting_underwriting, ready_to_accept] }
        premium: { type: number, minimum: 0 }
        excess: { type: number, minimum: 0 }
        sumInsured: { type: number, minimum: 0 }
        keyExclusion: { type: string }
        validUntil: { type: string, format: date-time, description: Defaults to 14 days for ready_to_accept }
        brokerNote: { type: string, maxLength: 2000 }
    IssuePolicyBody:
      type: object
      required: [policyNumber, coverStart, coverEnd]
      properties:
        policyNumber: { type: string, minLength: 3, maxLength: 60 }
        coverStart: { type: string, format: date }
        coverEnd: { type: string, format: date }
    PartnerClaimStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [acknowledged, under_assessment, info_requested, approved, partially_approved, rejected, paid, closed] }
        note: { type: string, maxLength: 2000 }
        insurerReference: { type: string }
        decisionAmount: { type: number, minimum: 0 }
        visibleToCustomer: { type: boolean, default: true }
    OfferResponseInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline] }
        reason: { type: string, maxLength: 500, description: Optional decline reason (kept for routing analytics) }
    Offer:
      type: object
      description: A request offered to a broker (`GET /partner/offers` item).
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        status: { type: string, enum: [offered, accepted, declined, expired, withdrawn] }
        round: { type: integer, description: Offer round (1 = first batch of brokers) }
        offered_at: { type: string, format: date-time }
        responds_by: { type: string, format: date-time, description: Accept before this or the request moves on }
        acceptUrl: { type: [string, "null"], description: One-tap accept link (web) }
        deepLink: { type: [string, "null"], description: "covva://offers/accept/{token}" }
        request: { type: object, description: "id, reference, title, type, status, risk_data, talk_to_expert, complexity_flags, category" }

    # --- Broker workspace on mobile (Addendum 4 §2) ---
    DocumentKind:
      type: string
      enum: [id_document, vehicle_registration, drivers_licence, photo, proof_of_address, medical, policy_schedule, certificate, policy_wording, receipt, endorsement, claim_evidence, police_report, invoice, other]
    SalesDay:
      type: object
      description: One day of the sales funnel (from `partner_sales_summary`).
      properties:
        day: { type: string, format: date }
        requests: { type: integer }
        quotes: { type: integer }
        conversions: { type: integer, description: Applications accepted }
        policies_issued: { type: integer }
        premium: { type: number }
        platform_fee: { type: number }
        broker_commission: { type: number }
    PartnerDashboard:
      type: object
      properties:
        org: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, type: { type: string, enum: [broker, insurer] }, role: { type: [string, "null"] } } }
        range: { type: object, properties: { days: { type: integer }, from: { type: string, format: date }, to: { type: string, format: date } } }
        kpis:
          type: object
          properties:
            requests: { type: integer }
            quotes: { type: integer }
            conversions: { type: integer }
            policiesIssued: { type: integer }
            premium: { type: number }
            platformFee: { type: number }
            brokerCommission: { type: number }
            conversionRate: { type: [number, "null"], description: Conversions as % of quotes }
            change: { type: object, additionalProperties: { type: [number, "null"] }, description: "% change vs the previous period per KPI" }
        series: { type: array, items: { $ref: "#/components/schemas/SalesDay" } }
        open: { type: object, properties: { offers: { type: integer }, requests: { type: integer }, submissions: { type: integer }, claims: { type: integer } } }
        renewals: { type: object, properties: { count: { type: integer }, windowDays: { type: integer }, next: { type: array, items: { type: object }, description: "First 10 rows of partner_renewals (snake_case)" } } }
        claims:
          type: object
          properties:
            byStatus: { type: object, additionalProperties: { type: integer } }
            total: { type: integer }
            open: { type: integer }
            decided: { type: integer }
            avgDaysToDecision: { type: [number, "null"] }
            staleOpen: { type: integer, description: Open for more than 14 days }
            openSlaBreaches: { type: [integer, "null"], description: Null until SLA timers exist }
        sla:
          type: object
          properties:
            requests_measured: { type: integer }
            requests_on_time: { type: integer }
            requests_breached: { type: integer }
            requests_open_overdue: { type: integer }
            submissions_measured: { type: integer }
            submissions_on_time: { type: integer }
            submissions_late: { type: integer }
            submissions_open_overdue: { type: integer }
            on_time_rate: { type: [number, "null"], description: Percentage }
        lapses:
          type: object
          properties: { lapsed: { type: integer }, cancelled: { type: integer }, expired: { type: integer }, renewed: { type: integer }, active: { type: integer }, ended: { type: integer }, lapse_rate: { type: [number, "null"] } }
        commission: { oneOf: [{ $ref: "#/components/schemas/CommissionRow" }, { type: "null" }] }
        commissionVisible: { type: boolean }
        period: { type: string, example: "2026-10" }
    CommissionRow:
      type: object
      description: Raw row of `partner_commission_summary` (snake_case).
      properties:
        period: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        currency: { type: string }
        earned: { type: number }
        paid: { type: number }
        outstanding: { type: number }
        revenue_share: { type: number }
        platform_fee: { type: number }
        entries: { type: integer }
        statement_id: { type: [string, "null"], format: uuid }
        statement_status: { type: [string, "null"], enum: [draft, issued, paid, null] }
        statement_net_due: { type: [number, "null"] }
    CommissionSummary:
      type: object
      properties:
        period: { type: string, example: "2026-10" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        currency: { type: string }
        earned: { type: number, description: Brokers — commission credited; insurers — commission payable }
        paid: { type: number }
        outstanding: { type: number }
        revenueShare: { type: number }
        platformFee: { type: number }
        entries: { type: integer }
        statement: { type: [object, "null"], properties: { id: { type: string, format: uuid }, status: { type: string }, netDue: { type: number } } }
        side: { type: string, enum: [earned, payable] }
        note: { type: string }
    RenewalItem:
      type: object
      properties:
        policyId: { type: string, format: uuid }
        reference: { type: string }
        policyNumber: { type: [string, "null"] }
        category: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        coverEnd: { type: string, format: date }
        daysLeft: { type: integer }
        premium: { type: [number, "null"] }
        currency: { type: string }
        status: { type: string }
        customer:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string, description: Full name for brokers; first name + initial for insurers }
            email: { type: [string, "null"], description: Brokers only }
            phone: { type: [string, "null"], description: Brokers only }
        contactAllowed: { type: boolean, description: Latest data-sharing consent for your organisation type }
        marketingAllowed: { type: boolean }
        renewalRequest: { type: [object, "null"], properties: { id: { type: string, format: uuid }, status: { type: string } } }
        remindersSent: { type: integer }
    PartnerClaimUpdateInput:
      type: object
      description: Give a status, a note, or both.
      properties:
        status: { type: string, enum: [delivered_to_insurer, acknowledged, under_assessment, info_requested] }
        note: { type: string, maxLength: 2000 }
        visibleToCustomer: { type: boolean, default: true }
    ClientSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        accountType: { type: string, enum: [individual, business] }
        businessName: { type: [string, "null"] }
        kycStatus: { type: string, enum: [unverified, pending, verified, rejected] }
        region: { type: [string, "null"] }
        city: { type: [string, "null"] }
        source: { type: string, enum: [assignment, request, policy], description: How the client is linked to the broker }
        assignedSince: { type: [string, "null"], format: date-time }
        openRequests: { type: integer }
        activePolicies: { type: integer }
        lastRequestAt: { type: [string, "null"], format: date-time }
    PartnerDocumentUploadInput:
      type: object
      required: [fileName, mimeType, content]
      properties:
        fileName: { type: string, maxLength: 200 }
        mimeType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp, image/heic, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document] }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        content: { type: string, description: "Base64 file contents (plain or data: URL), max 20 MB decoded" }
        requestId: { type: string, format: uuid }
        policyId: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        deliveredToInsurer: { type: boolean, default: false }
    PartnerMessageInput:
      type: object
      required: [requestId, body]
      properties:
        requestId: { type: string, format: uuid }
        body: { type: string, minLength: 1, maxLength: 4000 }
        attachments: { type: array, maxItems: 10, items: { type: object, properties: { documentId: { type: string, format: uuid }, name: { type: string } } } }
        internal: { type: boolean, default: false, description: Team-only note, never shown to the customer }
    PartnerProfile:
      type: object
      properties:
        organisation: { type: object, description: "organizations row: name, slug, type, status, logo_url, contact_email, contact_phone, website, address, region, NIC licence fields, integration_level" }
        membership: { type: [object, "null"], properties: { role: { type: string }, roleLabel: { type: string }, isSupervisor: { type: boolean }, canEditProfile: { type: boolean } } }
        teamSize: { type: integer }
        links:
          type: object
          description: Insurer appointments (brokers see insurers; insurers see brokers)
          properties:
            kind: { type: string, enum: [insurers, brokers] }
            active: { type: integer }
            items: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, active: { type: boolean }, organisation: { type: object }, category: { type: [object, "null"] }, agreementReference: { type: [string, "null"] }, startsOn: { type: [string, "null"] }, endsOn: { type: [string, "null"] } } } }
        workspaces: { type: array, items: { type: object, properties: { orgId: { type: string, format: uuid }, orgName: { type: string }, type: { type: string }, role: { type: string } } } }
    UpdatePartnerProfileInput:
      type: object
      minProperties: 1
      properties:
        contactEmail: { type: [string, "null"], format: email }
        contactPhone: { type: [string, "null"] }
        website: { type: [string, "null"], format: uri }
        address: { type: [string, "null"], maxLength: 400 }
        region: { type: [string, "null"], maxLength: 100 }
        description: { type: [string, "null"], maxLength: 2000 }
    ClaimMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        attachments: { type: array, maxItems: 10, items: { type: object, required: [name], properties: { documentId: { type: string, format: uuid }, storagePath: { type: string }, name: { type: string, maxLength: 200 } } } }
        internal: { type: boolean, default: false, description: Partner/staff-only note; rejected for customers }
    ClaimInfoRequestInput:
      type: object
      required: [message]
      properties:
        kind: { type: string, enum: [document, information, inspection], default: document }
        requestedParty: { type: string, enum: [customer, broker], default: customer }
        message: { type: string, minLength: 3, maxLength: 2000 }
        dueAt: { type: string, format: date-time }
        setStatus: { type: boolean, default: false, description: Insurers only — also move the claim to info_requested }
    FulfilInfoRequestInput:
      type: object
      description: Give a documentId, a response, or both.
      properties:
        documentId: { type: string, format: uuid }
        response: { type: string, maxLength: 2000 }
    ClaimVideoUploadInput:
      type: object
      required: [fileName, mimeType, content]
      properties:
        fileName: { type: string, maxLength: 200 }
        mimeType: { type: string, enum: [video/mp4, video/webm, video/quicktime] }
        durationSeconds: { type: integer, minimum: 0, description: Measured on the device; max 90 }
