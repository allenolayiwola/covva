        directBilling: { type: boolean, default: false }
        estimate: { type: number, minimum: 0 }
        scheduledFor: { type: string, format: date-time }
        notes: { type: string, maxLength: 2000 }
    UpdateClaimJobInput:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [requested, accepted, in_progress, completed, cancelled] }
        estimate: { type: number, minimum: 0 }
        invoiceDocumentId: { type: string, format: uuid }
        scheduledFor: { type: [string, "null"], format: date-time }
        directBilling: { type: boolean }
        notes: { type: string, maxLength: 2000 }
    CreateBeneficiaryInput:
      type: object
      required: [fullName, relationship, phone]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        relationship: { type: string, enum: [parent, spouse, child, sibling, other] }
        phone: { type: string, description: "Ghana mobile number (024 123 4567 / +233…); stored as +233XXXXXXXXX" }
        email: { type: string, format: email }
        dateOfBirth: { type: string, format: date }
        ghanaCardNumber: { type: string, description: "GHA-123456789-0; masked in every response" }
        address: { type: string, maxLength: 300 }
        region: { type: string, maxLength: 60 }
        notes: { type: string, maxLength: 1000 }
    UpdateBeneficiaryInput:
      allOf: [{ $ref: "#/components/schemas/CreateBeneficiaryInput" }]
      required: []
      minProperties: 1
    Beneficiary:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        relationship: { type: string, enum: [parent, spouse, child, sibling, other] }
        phone: { type: string }
        email: { type: [string, "null"] }
        date_of_birth: { type: [string, "null"], format: date }
        ghana_card_masked: { type: [string, "null"], example: "GHA-•••••6789-0" }
        region: { type: [string, "null"] }
        linked_user_id: { type: [string, "null"], format: uuid }
        has_account: { type: boolean }
        consent_status: { type: string, enum: [pending, granted, declined, expired] }
        consent_channel: { type: [string, "null"], enum: [sms, whatsapp, null] }
        consent_sent_at: { type: [string, "null"], format: date-time }
        consent_granted_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    RequestConsentInput:
      type: object
      properties:
        kind: { type: string, enum: [data_sharing, proxy_claims, policy_purchase], default: data_sharing }
        channel: { type: string, enum: [sms, whatsapp], default: sms }
    ConfirmConsentInput:
      type: object
      required: [code]
      properties:
        kind: { type: string, enum: [data_sharing, proxy_claims, policy_purchase], default: data_sharing }
        code: { type: string, pattern: "^\\d{6}$" }
    CreateSponsorshipInput:
      type: object
      required: [beneficiaryId]
      properties:
        beneficiaryId: { type: string, format: uuid }
        requestId: { type: string, format: uuid, description: One of requestId / policyId is required }
        policyId: { type: string, format: uuid }
        gift: { type: boolean, default: false }
        giftMessage: { type: string, maxLength: 500 }
        notifyBeneficiary: { type: boolean, default: true, description: Send the beneficiary documents, reminders and claim updates too }
    Sponsorship:
      type: object
      properties:
        id: { type: string, format: uuid }
        sponsor_user_id: { type: string, format: uuid }
        beneficiary_id: { type: string, format: uuid }
        request_id: { type: [string, "null"], format: uuid }
        policy_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [draft, active, ended] }
        gift: { type: boolean }
        gift_message: { type: [string, "null"] }
        gift_revealed_at: { type: [string, "null"], format: date-time }
        notify_beneficiary: { type: boolean }
        started_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ProxyClaimInput:
      allOf: [{ $ref: "#/components/schemas/ReportClaimInput" }]
      properties:
        evidence:
          type: array
          maxItems: 20
          description: Files already uploaded under the sponsor's folder (§7 upload flow)
          items: { type: object, required: [path, name], properties: { path: { type: string }, name: { type: string }, mime: { type: string }, size: { type: integer } } }
    FamilyDashboard:
      type: object
      properties:
        summary:
          type: object
          properties:
            activePolicies: { type: integer }
            pendingPolicies: { type: integer }
            nextRenewal: { type: [object, "null"], properties: { policyId: { type: string, format: uuid }, coverEnd: { type: string, format: date }, days: { type: integer } } }
            nextPaymentDue: { type: [object, "null"], properties: { paymentId: { type: string }, dueAt: { type: string }, amount: { type: [number, "null"] }, currency: { type: [string, "null"] } } }
            openClaims: { type: integer }
            annualPremiumGHS: { type: number }
            coverGaps: { type: array, items: { type: object, properties: { beneficiaryId: { type: string, format: uuid }, name: { type: string }, reason: { type: string, enum: [no_cover, consent_pending, consent_declined] } } } }
        beneficiaries: { type: array, items: { allOf: [{ $ref: "#/components/schemas/Beneficiary" }, { properties: { consents: { type: array, items: { type: object, properties: { kind: { type: string }, granted: { type: boolean }, granted_at: { type: [string, "null"] }, declined_at: { type: [string, "null"] }, expires_at: { type: [string, "null"] }, requested_at: { type: [string, "null"] }, locked_at: { type: [string, "null"] } } } } } }] } }
        sponsorships: { type: array, items: { $ref: "#/components/schemas/Sponsorship" } }
        policies: { type: array, items: { type: object, description: "policies row (lite) + category + insurer, with sponsor_user_id / beneficiary_id" } }
        claims: { type: array, items: { type: object, description: "claims row (lite) with reported_by_user_id" } }
        payments: { type: array, items: { type: object, description: "payments row (lite)" } }
        subscriptions: { type: array, items: { type: object, description: "sponsor_subscriptions row (lite): status, cadence, display_amount, display_currency, ghs_amount, next_charge_at" } }
    # --- Diaspora payments ---------------------------------------------------------
    FxRates:
      type: object
      properties:
        base: { type: string, enum: [GHS] }
        currencies: { type: array, items: { type: string } }
        marginPct: { type: number, description: "Platform display buffer (% of the rate) added to the indicative foreign amount; shown to the payer, never collected by Covva" }
        rates:
          type: object
          additionalProperties:
            type: [object, "null"]
            properties:
              rate: { type: number, description: GHS per 1 unit }
              source: { type: string, enum: [manual, openexchangerates, bog, provider] }
              fetchedAt: { type: string, format: date-time }
              validUntil: { type: [string, "null"], format: date-time }
              manual: { type: boolean, description: Flag the rate as a manual/indicative override in the UI }
        selected: { type: [object, "null"], properties: { currency: { type: string }, rate: { type: number }, source: { type: string }, fetchedAt: { type: string }, disclosure: { type: string } } }
        quote: { type: [object, "null"], $ref: "#/components/schemas/FxQuote" }
        indicative: { type: boolean }
        note: { type: string }
    FxQuote:
      type: object
      description: Indicative display of a GHS amount. `ghsAmount` is the contract amount the insurer receives.
      properties:
        displayCurrency: { type: string, enum: [GHS, GBP, USD, EUR, CAD] }
        ghsAmount: { type: number }
        displayAmount: { type: number }
        rate: { type: number, description: GHS per 1 unit after the margin }
        baseRate: { type: number }
        marginPct: { type: number }
        source: { type: string }
        quotedAt: { type: string, format: date-time }
        indicative: { type: boolean }
        disclosure: { type: string, description: "Plain-language FX disclosure to show next to the price" }
    PaymentMethod:
      type: object
      description: Saved card by PSP token (never a PAN).
      properties:
        id: { type: string, format: uuid }
        psp: { type: string, enum: [paystack_intl, stripe, paystack, simulator] }
        brand: { type: [string, "null"] }
        last4: { type: [string, "null"] }
        exp_month: { type: [integer, "null"] }
        exp_year: { type: [integer, "null"] }
        billing_country: { type: [string, "null"] }
        currency: { type: [string, "null"] }
        is_default: { type: boolean }
        status: { type: string, enum: [active, expired, revoked] }
        created_at: { type: string, format: date-time }
    SponsorSubscription:
      type: object
      description: "sponsor_subscriptions row (public columns) plus `summary` from @im/core subscriptionSummary()."
      properties:
        id: { type: string, format: uuid }
        policy_id: { type: [string, "null"], format: uuid }
        beneficiary_id: { type: [string, "null"], format: uuid }
        cadence: { type: string, enum: [monthly, quarterly, annual] }
        display_currency: { type: string }
        display_amount: { type: number, description: Indicative amount in display_currency }
        ghs_amount: { type: number, description: Contract amount collected for the insurer per charge }
        fx_rate: { type: [number, "null"] }
        fx_source: { type: [string, "null"] }
        payment_method_id: { type: [string, "null"], format: uuid }
        psp: { type: string }
        status: { type: string, enum: [active, past_due, paused, cancelled] }
        next_charge_at: { type: string, format: date-time }
        last_charged_at: { type: [string, "null"], format: date-time }
        past_due_since: { type: [string, "null"], format: date-time }
        failures: { type: integer, description: "Consecutive failed collections (retries 1d, 3d, 7d, then past_due)" }
        summary:
          type: object
          properties:
            cadenceLabel: { type: string }
            statusLabel: { type: string }
            tone: { type: string, enum: [ok, danger, wait, neutral] }
            hint: { type: string }
            amountLabel: { type: string }
            nextChargeLabel: { type: string }
            failures: { type: integer }
            daysToNext: { type: [integer, "null"] }
    CreateSubscriptionInput:
      type: object
      properties:
        policyId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid, description: "Alternative to policyId: the paid application whose policy the subscription continues" }
        cadence: { type: string, enum: [monthly, quarterly, annual], default: monthly }
        displayCurrency: { type: string, enum: [GHS, GBP, USD, EUR, CAD], default: GHS }
        paymentMethodId: { type: string, format: uuid, description: Defaults to the sponsor's default saved method }
        beneficiaryId: { type: string, format: uuid }
    PropertyUpdateInput:
      type: object
