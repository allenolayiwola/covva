              converted_at: { type: [string, "null"], format: date-time }
              request_reference: { type: [string, "null"] }
              category_slug: { type: [string, "null"] }
              request_status: { type: [string, "null"] }
              policy_status: { type: [string, "null"] }
              customer_first_name: { type: [string, "null"] }
