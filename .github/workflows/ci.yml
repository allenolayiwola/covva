name: CI

# Quick checks for every pull request and for main: typecheck, lint, unit tests, build.
# Nothing here talks to the shared Supabase project (no database or browser suites; see
# integration.yml, which is run manually).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public values only (the publishable key is safe to expose; see .env.example). They are needed at
  # build time for NEXT_PUBLIC_* inlining; the build never calls the database.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://krmnyqaweawkpygjmdry.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_31vynddS7Uu45RJAYp0MUQ_OaBkDx22' }}
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  NEXT_PUBLIC_ADMIN_URL: http://localhost:3101
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads "packageManager" from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build caches
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/admin/.next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**/src/**', 'packages/**/src/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # apps/web and apps/admin run `next typegen` before tsc, so PageProps/LayoutProps exist on a clean checkout.
      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build web and admin
        run: pnpm turbo run build --filter=@im/web --filter=@im/admin
